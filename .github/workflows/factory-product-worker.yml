name: Factory Product Worker

'on':
  repository_dispatch:
    types:
      - factory-work-execute

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - name: Apply Factory-owned Antigravity build
        env:
          RUN_ID: ${{ github.event.client_payload.runId }}
          SOURCE_REPOSITORY: ${{ github.event.client_payload.sourceRepository }}
          SOURCE_ISSUE: ${{ github.event.client_payload.sourceIssue }}
        run: node factory/apply-factory-antigravity-result.mjs
      - name: Verify implemented product
        id: verify
        continue-on-error: true
        run: |
          npm run typecheck
          npm test
          npm run build
          PRODUCT_PATHS=(src index.html package.json vite.config.ts tsconfig.json)
          if [ -d public ]; then PRODUCT_PATHS+=(public); fi
          if git diff --quiet -- "${PRODUCT_PATHS[@]}" && [ -z "$(git ls-files --others --exclude-standard -- "${PRODUCT_PATHS[@]}")" ]; then
            echo "::error::Antigravity produced no product implementation changes."
            exit 1
          fi
      - name: Repair generated implementation
        if: steps.verify.outcome == 'failure'
        run: |
          node factory/repair-generated-implementation.mjs
          npm run typecheck
          npm test
          npm run build
          PRODUCT_PATHS=(src index.html package.json vite.config.ts tsconfig.json)
          if [ -d public ]; then PRODUCT_PATHS+=(public); fi
          if git diff --quiet -- "${PRODUCT_PATHS[@]}" && [ -z "$(git ls-files --others --exclude-standard -- "${PRODUCT_PATHS[@]}")" ]; then
            echo "::error::Repair produced no valid product implementation changes."
            exit 1
          fi
      - name: Record Factory execution evidence
        env:
          RUN_ID: ${{ github.event.client_payload.runId }}
          SOURCE_REPOSITORY: ${{ github.event.client_payload.sourceRepository }}
          SOURCE_ISSUE: ${{ github.event.client_payload.sourceIssue }}
        run: |
          mkdir -p factory-evidence
          printf '{"runId":"%s","sourceRepository":"%s","sourceIssue":"%s","status":"verified","workflowRun":"%s"}\n' "$RUN_ID" "$SOURCE_REPOSITORY" "$SOURCE_ISSUE" "$GITHUB_RUN_ID" > factory-evidence/latest.json
      - name: Commit evidence and open safe machine PR
        env:
          RUN_ID: ${{ github.event.client_payload.runId }}
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="factory/execution-${GITHUB_RUN_ID}"
          git config user.name "OGroup AI Factory"
          git config user.email "factory@ogroup.local"
          git checkout -b "$BRANCH"
          git add -A -- src index.html package.json vite.config.ts tsconfig.json factory-evidence
          if [ -d public ]; then git add -A -- public; fi
          IMPLEMENTATION_COUNT="$(git diff --cached --name-only | grep -Ev '^(factory-evidence/|\.github/|.*\.md$)' | wc -l | tr -d ' ')"
          if [ "$IMPLEMENTATION_COUNT" = "0" ]; then
            echo "::error::No implementation files staged; refusing evidence-only completion."
            exit 1
          fi
          git commit -m "Factory implementation: $RUN_ID"
          git push origin "$BRANCH"
          PR_URL="$(gh pr create --title "Factory execution: $RUN_ID" --body "Antigravity implementation completed and independently verified by the Factory. Source: $RUN_ID" --base main --head "$BRANCH")"
          PR_NUMBER="$(gh pr view "$PR_URL" --json number --jq .number)"
          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"
      - name: Re-verify exact machine PR head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_HEAD="$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)"
          test "$PR_HEAD" = "$(git rev-parse HEAD)"
          npm run typecheck
          npm test
          npm run build
      - name: Wait for exact-head Dashboard Quality Gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_HEAD="$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)"
          test "$PR_HEAD" = "$(git rev-parse HEAD)"
          for attempt in $(seq 1 30); do
            RUN_JSON="$(gh run list --workflow ci.yml --branch "factory/execution-${GITHUB_RUN_ID}" --event pull_request --limit 10 --json databaseId,headSha,status,conclusion --jq "[.[] | select(.headSha == \"$PR_HEAD\")][0] // {}")"
            STATUS="$(printf '%s' "$RUN_JSON" | jq -r '.status // empty')"
            CONCLUSION="$(printf '%s' "$RUN_JSON" | jq -r '.conclusion // empty')"
            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "Exact-head Dashboard Quality Gate is green."
                exit 0
              fi
              echo "::error::Exact-head Dashboard Quality Gate completed with: $CONCLUSION"
              exit 1
            fi
            sleep 5
          done
          echo "::error::Timed out waiting for exact-head Dashboard Quality Gate."
          exit 1
      - name: Merge verified machine PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "$PR_NUMBER" --squash --match-head-commit "$(git rev-parse HEAD)"
      - name: Report verified evidence to Project Brain
        env:
          FACTORY_CALLBACK_TOKEN: ${{ secrets.FACTORY_CALLBACK_TOKEN }}
          FACTORY_CONTROL_API_URL: ${{ secrets.FACTORY_CONTROL_API_URL }}
          RUN_ID: ${{ github.event.client_payload.runId }}
          TENANT_ID: ${{ github.event.client_payload.tenant }}
        run: |
          if [ -z "$FACTORY_CONTROL_API_URL" ] || [ -z "$FACTORY_CALLBACK_TOKEN" ] || [ -z "$TENANT_ID" ]; then
            echo "::notice::Project Brain evidence callback is not configured for this dispatch."
            exit 0
          fi
          curl --fail-with-body -sS -X POST "$FACTORY_CONTROL_API_URL/internal/v1/factory/runs/$RUN_ID/evidence" \\
            -H "x-factory-control-key: $FACTORY_CALLBACK_TOKEN" -H "content-type: application/json" \\
            --data "$(jq -nc --arg tenant "$TENANT_ID" --arg workflow "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" '{tenant:$tenant,kind:"testing",evidence:{status:"verified",typecheck:"passed",tests:"passed",build:"passed",workflowRun:$workflow,commit:$sha}}')"

      - name: Report completion to Factory
        if: success()
        env:
          FACTORY_CALLBACK_TOKEN: ${{ secrets.FACTORY_CALLBACK_TOKEN }}
          SOURCE_REPOSITORY: ${{ github.event.client_payload.sourceRepository }}
          SOURCE_ISSUE: ${{ github.event.client_payload.sourceIssue }}
          RUN_ID: ${{ github.event.client_payload.runId }}
        run: |
          if [ -z "$FACTORY_CALLBACK_TOKEN" ]; then
            echo "::error::FACTORY_CALLBACK_TOKEN is required for cross-repository completion."
            exit 1
          fi
          SLICE_ID="$(jq -r '.sliceId // "dashboard-shell-home"' factory-evidence/antigravity-latest.json)"
          BUILD_ID="$(jq -r '.buildId // empty' factory-evidence/antigravity-latest.json)"
          gh api --method POST "repos/$SOURCE_REPOSITORY/issues/$SOURCE_ISSUE/comments" \
            -H "Authorization: Bearer $FACTORY_CALLBACK_TOKEN" \
            -f body="FACTORY_SLICE_COMPLETED $RUN_ID $SLICE_ID $BUILD_ID $GITHUB_SHA

Slice completed automatically after implementation, independent verification, green exact-head PR gate, and merge. Product repository: $GITHUB_REPOSITORY. Worker workflow: $GITHUB_RUN_ID."
          echo "Slice $SLICE_ID recorded. Factory orchestrator owns overall issue completion."
