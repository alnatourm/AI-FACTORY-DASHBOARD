name: Dashboard Quality Gate

on:
  push:
    branches: [main, build/dashboard-v0.1]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies with registry retry
        shell: bash
        run: |
          set -e
          for attempt in 1 2 3; do
            npm install && exit 0
            if [ "$attempt" = "3" ]; then exit 1; fi
            echo "npm registry attempt $attempt failed; retrying..."
            sleep $((attempt * 5))
          done
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
